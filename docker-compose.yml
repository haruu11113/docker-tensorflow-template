version: "3"
services:
  tf:
    container_name: docker-tensorflow-template-tf
    build:
      # context: ./repo/
      dockerfile: ./infra/docker/tensorflow/Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            # - capabilities: [gpu]
              - driver: nvidia
                device_ids: ['0', '1', '2']
                capabilities: [gpu]
    ports:
    - "8888:8888"
    - "8787:8787"
    - "8080:8080"
    volumes:
        # - /home/storage2/haru/predict_Details/repo:/home/ec2-user/repo/
        - /home/storage2/rescue_storage3/haru/predict_Details/repo:/home/ec2-user/repo/
        - ../.jupyter/:/root/.jupyter/

  vllm:
    build:
      dockerfile: ./infra/docker/vllm/Dockerfile
    environment:
      - NVIDIA_DISABLE_REQUIRE=1
    profiles: ["llm"]          # make up では起動しない
    ipc: host                  # テンソル並列時に必須。1枚でも付けて害なし
    deploy:
      resources:
        reservations:
          devices:
              - driver: nvidia
                device_ids: ['3']        # まずは空いている 3 番だけ
                capabilities: [gpu]
    ports:
    - "8000:8000"
    volumes:
        # モデルの置き場。named volume にすると make destroy で消えるので bind mount
        - /home/storage2/rescue_storage3/haru/hf_cache:/root/.cache/huggingface
    command:
      - --model
      - Qwen/Qwen3-8B-AWQ          # 11GB 1枚なら 4bit 版。fp16 の 8B は 16GB で載らない
      - --dtype
      - half                        # Turing は bf16 非対応
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.90"
      - --served-model-name
      - qwen3
      - --enforce-eager          # CUDA graph を使わない。Turing＋古いドライバ対策

